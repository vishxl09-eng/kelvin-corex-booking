<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Kelvin Corex — Book Appointment</title>
<style>
:root{--ink:#111;--muted:#777;--paper:#fff;--bg:#f4f1ec;--line:#e7e2da;--soft:#faf8f5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#eee9e1,#faf9f7 55%,#ece7df);color:var(--ink);min-height:100vh}
.wrap{width:min(100% - 28px,520px);margin:0 auto;padding:18px 0 30px}.card{background:rgba(255,255,255,.96);border:1px solid rgba(17,17,17,.06);border-radius:28px;padding:25px;box-shadow:0 18px 55px rgba(17,17,17,.10)}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}.logo{width:54px;height:54px;flex:0 0 54px;border-radius:17px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:-1px}.brand small{display:block;color:var(--muted);margin-top:2px;font-size:12px}.brand strong{font-size:17px}
h1{font-size:31px;line-height:1.08;letter-spacing:-1.2px;margin:0 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:24px}
label{display:block;font-weight:750;font-size:13px;margin:16px 0 7px}input,select,button{font:inherit}input,select{width:100%;min-height:50px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--soft);font-size:16px;outline:none;transition:.18s}input:focus,select:focus{border-color:#111;background:#fff;box-shadow:0 0 0 3px rgba(17,17,17,.06)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:11px;color:#8a867f;margin-top:6px}.primary{width:100%;min-height:54px;margin-top:22px;border:0;border-radius:15px;background:#111;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(17,17,17,.16);transition:transform .15s,opacity .15s}.primary:active{transform:scale(.985)}.primary:disabled{opacity:.55;cursor:wait}
.msg{display:none;padding:15px;border-radius:15px;margin-top:15px;font-size:14px;line-height:1.55}.success{background:#edf8ef;color:#155724;border:1px solid #d3ecd8}.error{background:#fff0f0;color:#8a1c1c;border:1px solid #f3d1d1}.foot{text-align:center;color:#8a867f;font-size:11px;margin:17px 0 0}
@media(max-width:390px){.wrap{width:min(100% - 18px,520px)}.card{padding:20px;border-radius:23px}h1{font-size:28px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
  <div class="brand"><div class="logo">KC</div><div><strong id="salonName">Kelvin Corex</strong><small>Appointment Booking</small></div></div>
  <h1>Book your next look.</h1><div class="sub">Choose your service, date and time. Your appointment will be confirmed after owner approval.</div>
  <form id="bookingForm">
    <label for="name">Your name</label><input id="name" required autocomplete="name" placeholder="Enter your name">
    <label for="phone">WhatsApp number</label><input id="phone" required inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit number"><div class="hint">We'll use WhatsApp for your appointment update.</div>
    <label for="service">Service</label><select id="service" required><option value="">Select a service</option><option>Haircut</option><option>Haircut + Beard</option><option>Beard</option><option>Hair Styling</option><option>Other</option></select>
    <div class="row"><div><label for="date">Date</label><input id="date" type="date" required></div><div><label for="time">Time</label><input id="time" type="time" required></div></div>
    <button id="submitBtn" class="primary" type="submit">Request Appointment</button>
  </form>
  <div id="success" class="msg success"></div><div id="error" class="msg error"></div>
  <div class="foot">Kelvin Corex • Simple booking • WhatsApp updates</div>
</main></div>
<script>
const form=document.getElementById('bookingForm'),success=document.getElementById('success'),error=document.getElementById('error'),date=document.getElementById('date'),time=document.getElementById('time');
const today=new Date(), todayStr=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10); date.min=todayStr;
fetch('/api/config').then(r=>r.json()).then(c=>{document.getElementById('salonName').textContent=c.salonName;time.min=String(c.openHour).padStart(2,'0')+':00';time.max=String(c.closeHour).padStart(2,'0')+':00'}).catch(()=>{});
form.addEventListener('submit',async e=>{e.preventDefault();success.style.display='none';error.style.display='none';const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Sending request…';try{const r=await fetch('/api/appointments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,phone:document.getElementById('phone').value,service:document.getElementById('service').value,date:date.value,time:time.value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Something went wrong.');success.innerHTML='<b>Appointment request sent ✓</b><br>We’ll confirm it after owner approval.';success.style.display='block';form.reset();date.min=todayStr}catch(err){error.textContent=err.message;error.style.display='block'}finally{btn.disabled=false;btn.textContent='Request Appointment'}});
</script>
</body></html>
