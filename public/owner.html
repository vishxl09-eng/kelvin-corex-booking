<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111">
<title>Kelvin Corex — Owner Dashboard</title>
<style>
:root{--ink:#111;--muted:#777;--bg:#f4f1ec;--card:#fff;--line:#e9e4dc}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(150deg,#eee9e1,#faf9f7 60%,#ebe6de);color:var(--ink);min-height:100vh}.wrap{width:min(100% - 28px,1050px);margin:auto;padding:20px 0 35px}.login{width:min(100%,420px);margin:9vh auto 0;background:#fff;border:1px solid #00000008;border-radius:26px;padding:26px;box-shadow:0 18px 55px #00000012}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:50px;height:50px;border-radius:15px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}.brand strong{font-size:17px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}h1,h2{letter-spacing:-.7px;margin:0}.muted{color:var(--muted);font-size:13px}.login input{width:100%;min-height:50px;margin:12px 0;padding:13px;border:1px solid var(--line);border-radius:13px;background:#faf8f5;font-size:16px}.btn{border:0;border-radius:13px;min-height:46px;padding:0 15px;background:#111;color:#fff;font-weight:750;cursor:pointer}.login .btn{width:100%}.err{color:#a51d2d;font-size:13px;margin-top:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.titleline{display:flex;align-items:end;gap:10px}.count{font-size:12px;color:#777;background:#fff;padding:6px 9px;border-radius:999px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:#fff;border:1px solid #00000007;border-radius:17px;padding:14px;box-shadow:0 6px 22px #00000008}.stat b{font-size:22px}.stat span{display:block;color:#777;font-size:11px;margin-top:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.item{background:#fff;border:1px solid #00000007;border-radius:20px;padding:18px;box-shadow:0 8px 28px #00000008}.itemhead{display:flex;justify-content:space-between;gap:10px}.item h3{margin:0 0 4px;font-size:17px}.phone{color:#777;font-size:12px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.detail div{background:#faf8f5;border-radius:12px;padding:10px;font-size:12px}.detail b{display:block;font-size:14px;margin-top:2px}.status{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850;letter-spacing:.3px}.pending{background:#fff2c9}.approved{background:#def4e3}.rejected{background:#ffe2e2}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.wa{min-height:40px;border:0;padding:0 12px;border-radius:11px;cursor:pointer;font-weight:750;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.approve{background:#18743b;color:#fff}.reject{background:#a51d2d;color:#fff}.wa{background:#128c7e;color:#fff}.remove{background:#f0ece6;color:#8b2a2a}.empty{background:#fff;border-radius:20px;padding:30px;text-align:center;color:#777}.loading{text-align:center;color:#777;padding:25px}
@media(max-width:600px){.wrap{width:min(100% - 18px,1050px);padding-top:12px}.top{align-items:flex-start}.top .btn{min-height:42px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:11px}.stat b{font-size:19px}.grid{grid-template-columns:1fr}.item{padding:16px}.actions>*{flex:1;min-width:0}.detail{margin:12px 0}.login{margin-top:5vh;padding:22px}}
@media(max-width:360px){.titleline{display:block}.count{display:inline-block;margin-top:5px}.stats{gap:6px}.stat span{font-size:10px}}
</style>
</head>
<body><div class="wrap">
<div id="login" class="login"><div class="brand"><div class="logo">KC</div><div><strong>Kelvin Corex</strong><small>Owner Dashboard</small></div></div><h2>Welcome back</h2><p class="muted">Enter your owner password to manage appointments.</p><input id="password" type="password" autocomplete="current-password" placeholder="Owner password"><button class="btn" onclick="login()">Open Dashboard</button><div id="loginErr" class="err"></div></div>
<div id="dashboard" style="display:none"><div class="top"><div><div class="titleline"><h1>Appointments</h1><span id="count" class="count">0</span></div><div class="muted">Manage booking requests from one place.</div></div><button class="btn" onclick="loadAppointments()">Refresh</button></div>
<div class="stats"><div class="stat"><b id="pendingCount">0</b><span>Pending</span></div><div class="stat"><b id="approvedCount">0</b><span>Approved</span></div><div class="stat"><b id="rejectedCount">0</b><span>Rejected</span></div></div>
<div id="list" class="grid"><div class="loading">Loading appointments…</div></div></div></div>
<script>
let password='';
function login(){password=document.getElementById('password').value;fetch('/api/appointments',{headers:{'x-admin-password':password}}).then(async r=>{if(!r.ok)throw new Error('Wrong password');return r.json()}).then(()=>{document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';loadAppointments()}).catch(e=>document.getElementById('loginErr').textContent=e.message)}
async function loadAppointments(){const list=document.getElementById('list');list.innerHTML='<div class="loading">Loading appointments…</div>';const r=await fetch('/api/appointments',{headers:{'x-admin-password':password}});if(!r.ok){list.innerHTML='<div class="empty">Session expired. Please refresh and login again.</div>';return}const items=await r.json();document.getElementById('count').textContent=items.length;document.getElementById('pendingCount').textContent=items.filter(a=>a.status==='pending').length;document.getElementById('approvedCount').textContent=items.filter(a=>a.status==='approved').length;document.getElementById('rejectedCount').textContent=items.filter(a=>a.status==='rejected').length;if(!items.length){list.innerHTML='<div class="empty">No appointments yet.<br><span class="muted">New booking requests will appear here.</span></div>';return}list.innerHTML=items.map(a=>{let actions='';if(a.status==='pending')actions=`<button class="approve" onclick="action('${a.id}','approve')">Approve</button><button class="reject" onclick="action('${a.id}','reject')">Reject</button>`;if(a.status==='approved')actions=`<a class="wa" target="_blank" rel="noopener" href="${waUrl(a, true)}">WhatsApp Customer</a>`;if(a.status==='rejected')actions=`<a class="wa" target="_blank" rel="noopener" href="${waUrl(a, false)}">WhatsApp Customer</a>`;actions+=`<button class="remove" onclick="removeAppointment('${a.id}')">Remove</button>`;return `<article class="item"><div class="itemhead"><div><h3>${escapeHtml(a.name)}</h3><div class="phone">+${escapeHtml(a.phone)}</div></div><span class="status ${a.status}">${a.status.toUpperCase()}</span></div><div class="detail"><div>Service<b>${escapeHtml(a.service)}</b></div><div>Date & Time<b>${escapeHtml(a.date)} • ${escapeHtml(a.time)}</b></div></div><div class="actions">${actions}</div></article>`}).join('')}
function waUrl(a,confirmed){const msg=confirmed?`Hi ${a.name}, your appointment at Kelvin Corex is CONFIRMED.\n\nService: ${a.service}\nDate: ${a.date}\nTime: ${a.time}\n\nThank you!`:`Hi ${a.name}, unfortunately your appointment request at Kelvin Corex could not be confirmed.\n\nRequested: ${a.date} at ${a.time}\nPlease message us to choose another time.`;return 'https://wa.me/'+a.phone+'?text='+encodeURIComponent(msg)}
async function action(id,type){const r=await fetch(`/api/appointments/${id}/${type}`,{method:'POST',headers:{'x-admin-password':password}});const data=await r.json();if(!r.ok){alert(data.error||'Error');return}await loadAppointments();if(data.whatsappLink)window.open(data.whatsappLink,'_blank')}
async function removeAppointment(id){if(!confirm('Remove this appointment permanently?'))return;const r=await fetch('/api/appointments/'+id,{method:'DELETE',headers:{'x-admin-password':password}});const data=await r.json();if(!r.ok){alert(data.error||'Could not remove appointment.');return}loadAppointments()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
